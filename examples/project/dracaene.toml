# Non-sensitive Dracaene high-quality profile. Overlayed on built-in defaults.

[splitting]
backend = "gemini"
input_mode = "video"
min_segment_seconds = 1.2
max_segment_seconds = 11.0
min_silence_ms = 260
merge_gap_ms = 180
padding_ms = 100
boundary_search_ms = 1200

[gemini]
model = "gemini-3.6-flash"

[gemini.chunking]
enabled = true
threshold_seconds = 150.0
target_seconds = 75.0
max_seconds = 100.0
boundary_search_seconds = 15.0
min_silence_seconds = 0.25
silence_noise_db = -42.0
video_height = 360
video_bitrate_kbps = 500
audio_bitrate_kbps = 64
reuse_chunks = true
keep_chunks = true

[asr]
enabled = true
provider = "sensevoice"
model = "iic/SenseVoiceSmall"
vad_model = "iic/speech_fsmn_vad_zh-cn-16k-common-pytorch"
model_revision = "master"
vad_revision = "master"
funasr_version = "1.3.23"
modelscope_version = "1.38.1"
device = "cuda:0"
language = "zh"

[asr.replacements]
"德蕾奇娜" = "德蕾琪娜"
"德雷奇娜" = "德蕾琪娜"
"晚咒" = "挽昼"
"晚重" = "挽昼"
"阿尔达" = "艾尔妲"
"林德威恩" = "林德薇恩"

[quality]
enabled = true
min_duration_seconds = 1.2
max_duration_seconds = 11.0
min_rms_dbfs = -42.0
max_rms_dbfs = -8.0
max_clipping_ratio = 0.001
max_silence_ratio = 0.40
min_transcript_similarity = 0.72
require_asr = false

[emotion]
provider = "rules"
base_url = "https://example.invalid/v1"
model = "replace-with-model-id"
api_key_env = "OPENAI_COMPAT_API_KEY"

[reference]
preferred_min_seconds = 3.0
preferred_max_seconds = 9.0

[inference]
default_model = "dracaene_v3_hq"
device = "cuda"
half = true
language = "zh"
seed = 2333

[training]
enabled = true

[training.gpt_sovits]
enabled = true
repository = "D:/GPT-SoVITS"
python = "D:/GPT-SoVITS/.venv/Scripts/python.exe"
experiment_name = "dracaene_mainline_v3_hq"
model_version = "v2ProPlus"
speaker = "dracaene"
language = "zh"
require_reviewed = true
full_precision = false
gpu = 0
sovits_batch_size = 4
sovits_epochs = 8
text_low_lr_rate = 0.4
sovits_save_every = 2
grad_checkpoint = false
lora_rank = 32
gpt_batch_size = 4
gpt_epochs = 12
gpt_save_every = 3

[training.rvc]
enabled = false
repository = "D:/RVC-WebUI"
python = "D:/RVC-WebUI/.venv/Scripts/python.exe"
experiment_name = "dracaene_rvc_v3_hq"
version = "v2"
sample_rate = "48k"
speaker = "dracaene"
language = "zh"
require_reviewed = true
gpu = 0
workers = 4
batch_size = 4
epochs = 160
save_every = 20
preprocess_seconds = 3.7
half = true

[postprocess]
enabled = false
backend = "rvc"
f0_method = "rmvpe"
transpose = 0
index_rate = 0.35
rms_mix_rate = 0.2
protect = 0.4
