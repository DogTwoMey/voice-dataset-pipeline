# Non-sensitive project configuration. This file is safe to commit per character.
# Credentials belong in a separate secrets/credentials.toml file.

[media]
ffmpeg_binary = "ffmpeg"
sample_rate = 48000
audio_extensions = [
  ".wav",
  ".flac",
  ".mp3",
  ".m4a",
  ".aac",
  ".ogg",
  ".opus",
  ".wma",
  ".aif",
  ".aiff",
]
video_extensions = [
  ".mp4",
  ".mkv",
  ".mov",
  ".avi",
  ".webm",
  ".m4v",
  ".wmv",
  ".flv",
  ".ts",
  ".mts",
  ".m2ts",
]

[splitting]
# energy is local. gemini is an explicit remote multimodal call.
backend = "energy"
# The CLI --modality option can select audio, video, or auto when supported.
input_mode = "audio"
frame_ms = 30
hop_ms = 10
adaptive_percentile = 20.0
threshold_offset_db = 10.0
threshold_floor_db = -55.0
threshold_ceiling_db = -25.0
min_speech_ms = 180
min_silence_ms = 180
min_segment_seconds = 0.8
merge_gap_ms = 300
padding_ms = 120
max_segment_seconds = 15.0
boundary_search_ms = 750
stream_block_frames = 65536

[gemini]
# Look up this name in secrets/credentials.toml, then in the process environment.
api_key_env = "GEMINI_API_KEY"
# Choose a Gemini model available to your account and region.
model = "gemini-3.6-flash"
timeout_seconds = 120.0
max_retries = 3

[gemini.chunking]
# Videos longer than threshold_seconds are transcoded into small, contiguous
# blocks around local silence before Gemini sees them.
enabled = true
threshold_seconds = 180.0
target_seconds = 90.0
max_seconds = 120.0
boundary_search_seconds = 15.0
min_silence_seconds = 0.30
silence_noise_db = -40.0
video_height = 360
video_bitrate_kbps = 500
audio_bitrate_kbps = 64
# Reuse content-addressed blocks after a retry; set keep_chunks=false to clean
# media files after each call (the timing manifest remains inspectable).
reuse_chunks = true
keep_chunks = true

[asr]
enabled = false
provider = "sensevoice"
model = "iic/SenseVoiceSmall"
vad_model = "iic/speech_fsmn_vad_zh-cn-16k-common-pytorch"
model_revision = "master"
vad_revision = "master"
funasr_version = "1.4.2"
modelscope_version = "1.39.1"
device = "cuda:0"
language = "auto"
# Per-character proper-noun corrections. Keep secrets out of this table.
replacements = {}

[quality]
enabled = true
min_duration_seconds = 1.0
max_duration_seconds = 12.0
min_rms_dbfs = -45.0
max_rms_dbfs = -8.0
max_clipping_ratio = 0.001
max_silence_ratio = 0.45
min_transcript_similarity = 0.72
require_asr = false

[emotion]
# rules is offline. For openai-compatible, replace both endpoint and model;
# api_key_env is read from the separate secrets file.
provider = "rules"
base_url = "https://example.invalid/v1"
model = "replace-with-model-id"
api_key_env = "OPENAI_COMPAT_API_KEY"
timeout_seconds = 60.0

[reference]
preferred_min_seconds = 3.0
preferred_max_seconds = 10.0

[inference]
default_model = ""
device = "cuda"
half = true
language = "zh"
seed = -1

[registry]
path = "models/registry.json"

[postprocess]
enabled = false
backend = "rvc"
f0_method = "rmvpe"
transpose = 0
index_rate = 0.45
rms_mix_rate = 0.25
protect = 0.33

[review]
# TUI number keys follow this exact order: 1 = neutral, 2 = happy, ...
emotions = [
  "neutral",
  "happy",
  "sad",
  "angry",
  "surprised",
  "fearful",
  "disgusted",
  "unknown",
]
# Gemini must choose one shared style cluster, avoiding per-clip singleton names.
clusters = [
  "calm_soft",
  "conversational",
  "bright_playful",
  "sad_soft",
  "tense_loud",
  "whisper",
  "unknown",
]
# Leave empty to use the operating system's default audio player.
play_command = ""

[training]
# This is an additional configuration gate. The CLI still requires --execute
# before it runs any external training command.
enabled = false

[training.gpt_sovits]
enabled = false
repository = "D:/GPT-SoVITS"
python = "D:/GPT-SoVITS/.venv/Scripts/python.exe"
experiment_name = "character_a_gpt_sovits"
model_version = "v2ProPlus"
speaker = "character_a"
language = "zh"
require_reviewed = true
gpu = 0
full_precision = true
sovits_batch_size = 6
sovits_epochs = 8
sovits_save_every = 2
text_low_lr_rate = 0.4
grad_checkpoint = false
lora_rank = 32
gpt_batch_size = 6
gpt_epochs = 12
gpt_save_every = 3

[training.rvc]
enabled = false
repository = "D:/RVC-WebUI"
python = "D:/RVC-WebUI/.venv/Scripts/python.exe"
experiment_name = "character_a_rvc"
version = "v2"
sample_rate = "48k"
require_reviewed = true
gpu = 0
workers = 4
batch_size = 6
epochs = 200
save_every = 25
preprocess_seconds = 3.7
half = true
