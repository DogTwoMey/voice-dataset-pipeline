[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dataset-pipeline"
version = "0.2.0"
description = "Headless character-voice dataset, training, emotion planning, and synthesis pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DogTwoMey" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
gemini = [
  "google-genai>=2.3,<3",
]
train = [
  "PyYAML>=6,<7",
]
asr = [
  "funasr==1.4.2",
  "modelscope==1.39.1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
all = [
  "google-genai>=2.3,<3",
  "PyYAML>=6,<7",
  "funasr==1.4.2",
  "modelscope==1.39.1",
]

[project.scripts]
voice-dataset = "voice_dataset_pipeline.cli:main"
voice-bundle = "voice_dataset_pipeline.voice_bundle:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
